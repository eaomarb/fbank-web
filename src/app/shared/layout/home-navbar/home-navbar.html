<nav class="bg-black text-gray-300 px-6 py-4 flex justify-between items-center">

    <a routerLink="/" class="text-white font-semibold text-lg tracking-wide">FBank</a>
  </div>

  <div class="flex items-center space-x-8">
    @if (!isAuthenticated()) {
    <a routerLink="/login" class="hover:text-white">Login</a>

      class="px-4 py-2 bg-white text-black font-medium hover:bg-gray-200 transition">Sign up</a>
    } @else if (hasCustomer()) {
    <a routerLink="/dashboard" class="px-4 py-2 bg-white text-black font-medium hover:bg-gray-200 transition">
      Go to dashboard
    </a>
    }
  </div>
</nav>
