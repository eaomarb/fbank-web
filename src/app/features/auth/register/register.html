<div class="flex flex-col min-h-screen">
    <home-navbar />

    <main class="flex-grow flex flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <h2 class="text-center text-2xl font-bold tracking-tight text-black">Create your account</h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-black">Email address</label>
                    <div class="mt-2">
                        <input id="email" type="email" name="email" required class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-black
                            placeholder:text-gray-500 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2
                            focus:outline-black sm:text-sm" />
                    </div>
                </div>

                <div>
                    <label for="displayName" class="block text-sm font-medium text-black">Display Name</label>
                    <div class="mt-2">
                        <input id="displayName" type="text" name="displayName" required
                            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-black
                        placeholder:text-gray-500 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-black sm:text-sm" />
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-black">Password</label>
                    <div class="mt-2">
                        <input id="password" type="password" name="password" required
                            class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-black placeholder:text-gray-500
                            outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-black sm:text-sm" />
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="flex w-full justify-center rounded-md bg-black px-3 py-1.5 text-sm font-semibold text-white shadow-xs
                        hover:bg-neutral-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black">
                        Sign up
                    </button>
                </div>
            </form>

            <p class="mt-10 text-center text-sm text-gray-500">
                Already have an account?
                <a routerLink="/login" class="font-semibold hover:text-gray-700">Login here</a>
            </p>
        </div>
    </main>

    <app-footer />
</div>
