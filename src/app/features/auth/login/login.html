<div class="flex flex-col min-h-screen">
    <home-navbar />

    <main class="grow flex flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <h2 class="text-center text-2xl/9 font-bold tracking-tight text-black">Login to your account</h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm/6 font-medium text-black">Email address</label>
                    <div class="mt-2">
                        <input id="email" type="email" name="email" required formControlName="email"
                            class="block w-full bg-white px-3 py-1.5 text-base text-black placeholder:text-gray-500 outline-1
                        -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-black sm:text-sm/6" />
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between">
                        <label for="password" class="block text-sm/6 font-medium text-black">Password</label>
                    </div>
                    <div class="mt-2">
                        <input id="password" type="password" name="password" required formControlName="password"
                            class="block w-full bg-white px-3 py-1.5 text-base text-black placeholder:text-gray-500
                        outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-black sm:text-sm/6" />
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="remember" type="checkbox" name="remember"
                        class="h-4 w-4 rounded border-gray-300 text-black focus:ring-black focus:ring-2" />
                    <label for="remember" class="ml-2 block text-sm text-black">Remember me</label>
                </div>

                <div>
                    <button type="submit" class="flex w-full justify-center bg-black px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-neutral-900
                    focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black">Login
                    </button>
                </div>
            </form>

            <p class="mt-10 text-center text-sm/6 text-gray-500">
                New to FBank?
                <a routerLink="/register" class="font-semibold hover:text-gray-700">Create an account now!</a>
            </p>
        </div>
    </main>

    <app-footer />
</div>
